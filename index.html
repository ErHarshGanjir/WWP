<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment In Progress</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #238636;
            --border: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            text-align: center;
            background: #161b22;
            padding: 2.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            max-width: 400px;
            width: 90%;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            animation: spin 1s linear infinite;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 1.5rem 0;
        }

        .status-bar {
            background: var(--border);
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress {
            background: var(--accent);
            height: 100%;
            width: 40%;
            position: absolute;
            left: 0;
            animation: loading 2s infinite ease-in-out;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes loading {
            0% { left: -40%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner"></div>
        <h1>Deployment Under Process</h1>
        <p>GitHub Actions is currently building and deploying your web app. Please refresh in a few moments.</p>
        <div class="status-bar">
            <div class="progress"></div>
        </div>
    </div>

</body>
</html>
